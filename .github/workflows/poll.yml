name: Poll LibreLinkUp

on:
  schedule:
    # GitHub gives no timing guarantee for `schedule:` at all — confirmed in
    # practice this ran every 25-50 min despite being set to */5. The real
    # trigger is now the Cloudflare Worker's own reliable cron calling this
    # workflow's dispatch API (see cloudflare-worker/wrangler.toml); this is
    # kept only as an infrequent fallback in case that ever stops working.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Poll and notify
        env:
          LIBRELINKUP_EMAIL: ${{ secrets.LIBRELINKUP_EMAIL }}
          LIBRELINKUP_PASSWORD: ${{ secrets.LIBRELINKUP_PASSWORD }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          REGISTRATION_SECRET: ${{ secrets.REGISTRATION_SECRET }}
        run: node scripts/poll.mjs
